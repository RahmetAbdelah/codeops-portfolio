<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup Form</title>
</head>
<body>
  <h2>Validated Signup Form</h2>
  
  <form id="signupForm">
    <div>
      <label for="name">Full Name:</label>
      <input type="text" id="name" name="name" required>
    </div>
    
    <div>
      <label for="phone">Ethiopian Phone Number:</label>
      <input type="text" id="phone" name="phone" placeholder="+251912345678 or 0912345678" required>
    </div>

    <button type="submit">Sign Up</button>
  </form>

  <p id="errorMessage" style="color: red;"></p>
  <p id="signupCount"></p>

  <script src="app.js"></script>
</body>
</html>
