<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Gallery Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

       
        header {
            background: #333;
            color: white;
            padding: 15px;
            text-align: center;
        }

     
        nav {
            background: #555;
            padding: 10px;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
        }

        nav a:hover {
            text-decoration: underline;
        }

        
        main {
            padding: 20px;
        }

        h2 {
            text-align: center;
        }

       
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }

        .gallery img {
            width: 220px;
            height: 150px;
            object-fit: cover;
            border-radius: 10px;
            transition: 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.1);
        }


        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Photo Gallery </h1>
        <p>Welcome to my website</p>
    </header>

  
    <nav>
        <a href="#">Home</a>
        <a href="#">Gallery</a>
        <a href="#">Contact</a>
    </nav>

    
    <main>
        <h2>Gallery</h2>

        <div class="gallery">
            <img src="https://picsum.photos/id/1015/300/200">
            <img src="https://picsum.photos/id/1016/300/200">
            <img src="https://picsum.photos/id/1018/300/200">
            <img src="https://picsum.photos/id/1020/300/200">
            <img src="https://picsum.photos/id/1024/300/200">
            <img src="https://picsum.photos/id/1027/300/200">
        </div>
    </main>

  
    <footer>
        <p>© 2026 My Website | All rights reserved</p>
    </footer>

</body>
</html>
