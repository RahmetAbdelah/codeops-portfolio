<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Habesha Eatery — Menu Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="menu-card">
    <h2 class="menu-card__name">Doro Wat</h2>
    <p class="menu-card__description">
      Slow-simmered chicken in a rich berbere sauce, served with a hard-boiled egg and injera.
    </p>
    <ul class="menu-card__ingredients">
      <li>Chicken</li>
      <li>Berbere spice</li>
      <li>Red onion</li>
      <li>Hard-boiled egg</li>
      <li>Clarified butter</li>
    </ul>
    <p class="menu-card__price" data-price="250">250</p>
  </div>

</body>
</html>
