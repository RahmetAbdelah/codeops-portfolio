<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birr Watch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Birr Watch</h1>
    <p id="status" class="status-msg"></p>

    <form id="convert-form" class="card">
      <div class="form-group">
        <label for="amount">Amount (ETB)</label>
        <input id="amount" type="number" step="any" value="100" min="0.01" required />
      </div>

      <div class="form-group">
        <label for="currency">Target Currency</label>
        <select id="currency"></select>
      </div>

      <div class="actions">
        <button type="submit" id="convert-btn">Convert</button>
        <button type="button" id="watch" class="secondary-btn">+ Watchlist</button>
      </div>
    </form>

    <p id="result" class="result-display"></p>

    <section class="watchlist-section">
      <h2>Watchlist</h2>
      <ul id="watchlist" class="watchlist-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
