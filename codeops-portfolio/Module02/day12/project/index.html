<header><h1>Contact Habesha Eatery</h1></header>
<nav>

    <a href="contact.html">Contact</a></nav>
<main>
<form action="/contact" method="post">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" required>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
        <label for="phone">phone:</label>
        <input type="tel" id="phone" name="phone" pattern="+251[0-9]{9}  aria-describedby="phoneHelp" required>
        <p id="phoneHelp">Please enter a valid phone number in the format +251</p>


</form>
</main>
<footer>Bole, Addis Ababa</footer>
