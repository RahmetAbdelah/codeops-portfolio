<header class="navbar">
  <div class="logo">MyBrand</div>
  <nav class="nav-right">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Services</a>
    <button class="btn">Contact</button>
  </nav>
</header>
<style>
    .navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem 2rem;
  background-color: #0a1f3d;
  color: white;
}


.nav-right {
  display: flex;
  align-items: center;
  gap: 1.5rem;
}

.nav-right a {
  color: white;
  text-decoration: none;
}

.btn {
  padding: 0.5rem 1rem;
  background-color: #d4a027;
  border: none;
  border-radius: 4px;
  cursor: pointer;
}
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 1rem;
}

.gallery img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  border-radius: 8px;
}
.page-layout {
  display: grid;
  grid-template-areas:
    "header  header"
    "sidebar main"
    "footer  footer";
  grid-template-columns: 200px 1fr;
  grid-template-rows: auto 1fr auto;
  min-height: 100vh;
  gap: 1rem;
}

.header  { grid-area: header; background: #0a1f3d; color: white; padding: 1rem; }
.sidebar { grid-area: sidebar; background: #e0e0e0; padding: 1rem; }
.main    { grid-area: main; background: #f9f9f9; padding: 1rem; }
.footer  { grid-area: footer; background: #0a1f3d; color: white; padding: 1rem; }

/* Responsive single-column layout for small screens */
@media (max-width: 700px) {
  .page-layout {
    grid-template-areas:
      "header"
      "main"
      "sidebar"
      "footer";
    grid-template-columns: 1fr;
  }
}
.product-card {
  position: relative; /* Anchor point for absolute positioning */
  width: 280px;
  padding: 1rem;
  border: 1px solid #ddd;
  border-radius: 8px;
  background: #fff;
}

.badge {
  position: absolute;
  top: -10px;
  right: -10px;
  width: 60px;
  height: 60px;
  background-color: #d9534f;
  color: white;
  border-radius: 50%; /* Circle shape */
  
  /* Center text inside the circle badge */
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  font-weight: bold;
  text-align: center;
  box-shadow: 0 2px 5px rgba(0,0,0,0.2);
}

.product-img {
  width: 100%;
  border-radius: 4px;
}
</style>
